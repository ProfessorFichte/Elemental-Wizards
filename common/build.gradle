architectury {
    common rootProject.enabled_platforms.split(',')
}


// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage stays in the platform modules. The datagen providers moved to `fabric/` for that reason.

    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries: released ones from the Modrinth maven. Modrinth serves only the per-loader
    // jars, so `common` keeps compiling against the `-fabric` flavour (this module's dummy platform).
    modImplementation("maven.modrinth:armor-model-api:${rootProject.armor_model_api_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}") { transitive = false }
    // More RPG Library stays on mavenLocal: this 1.20.1 port is not published on its Modrinth project
    // (see gradle.properties). It becomes maven.modrinth:more-rpg-library:<version>-<platform> once it is.
    modImplementation("net.more_rpg_classes:more_rpg_library-${platform}:${rootProject.more_rpg_library_version}") { transitive = false }
    modImplementation("net.foundation:structure_pool_api-${platform}:${rootProject.structure_pool_api_version}") { transitive = false }

    modCompileOnly("net.rpg_series:wizards-${platform}:${rootProject.wizards_version}") { transitive = false }
}
