modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = "https://github.com/ProfessorFichte/Elemental-Wizards/issues"
license = "ARR"

[[mods]]
modId = "elemental_wizards_rpg"
version = "${version}"
displayName = "Elemental Wizards (RPG Series Plus)"
authors = "Fichte"
description = '''
Master the elements to overcome your foes! Spell Engine Add-On
'''
logoFile = "icon.png"

[[dependencies.elemental_wizards_rpg]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.elemental_wizards_rpg]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_compat_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.elemental_wizards_rpg]]
modId = "forgified_fabric_api"
type = "required"
versionRange = "[${forgified_fabric_api_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.elemental_wizards_rpg]]
modId = "spell_engine"
type = "required"
versionRange = "[${spell_engine_version},)"
ordering = "NONE"
side = "BOTH"

# Wizards is NOT required: Elemental Wizards owns every asset it needs.
# It stays declared as an OPTIONAL dependency purely to pin a floor for the
# opt-in enrichment we ship for it (item tags + the village_wizard loot table),
# which assumes the item ids present since Wizards 3.0.2.
[[dependencies.elemental_wizards_rpg]]
modId = "wizards"
type = "optional"
versionRange = "[${wizards_version},)"
ordering = "NONE"
side = "BOTH"


[[mixins]]
config = "elemental_wizards_rpg.mixins.json"
