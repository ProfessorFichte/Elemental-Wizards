plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}


def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }

    def content = changelogFile.text
    def sections = content.split(/(?m)(?=^# )/)

    // Return the first section (most recent) after the split
    // Remove the first empty element if it exists
    def recentSection = sections.find { it.trim().startsWith('#') }
    return recentSection ?: "No changelog available"
}

loom {
    forge {
        // Forge 47 reads mixin configs from the jar MANIFEST (`MixinConfigs: ...`), which Loom writes from
        // this list (the NeoForge `[[mixins]]` table in mods.toml does not exist on Forge 47).
        mixinConfig "elemental_wizards_rpg.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

def generatedResources = project(':common').file('src/main/generated')
sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    // For Curios
    maven { url 'https://maven.theillusivec4.top/' }

    mavenLocal()
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries: released ones from the Modrinth maven. Modrinth serves only the per-loader
    // jars, so `common` keeps compiling against the `-fabric` flavour (this module's dummy platform).
    modImplementation("maven.modrinth:armor-model-api:${rootProject.armor_model_api_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}") { transitive = false }
    // More RPG Library stays on mavenLocal: this 1.20.1 port is not published on its Modrinth project
    // (see gradle.properties). It becomes maven.modrinth:more-rpg-library:<version>-<platform> once it is.
    modImplementation("net.more_rpg_classes:more_rpg_library-${platform}:${rootProject.more_rpg_library_version}") { transitive = false }
    modImplementation("net.foundation:structure_pool_api-${platform}:${rootProject.structure_pool_api_version}") { transitive = false }
    // Wizards has no 1.20.1 release on its Modrinth project, so it too stays on mavenLocal.
    modImplementation("net.rpg_series:wizards-${platform}:${rootProject.wizards_version}") { transitive = false }

    // Curios 5.x (1.20.1) - SpellEngine's Forge trinket-slot backend.
    modLocalRuntime("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}")

    // Forge 47 ships plain Mixin 0.8.5; SpellEngine's mixins need MixinExtras. It is JiJ'd in SpellEngine's
    // production jar, but Loom does not load nested jars of classpath mods, so the dev runtime needs a pin.
    // `localRuntime` keeps it out of the published POM. Never 0.4.1 (see toolchain recipe).
    localRuntime("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}")

    // Runes: dev runtime ONLY - the bundled `wizard_changes` resource pack names `runes:*` items.
    // Use the *production* jar (Loom remaps it); the `dev-shadow` classifier still carries SRG references.
    modLocalRuntime("maven.modrinth:runes:${rootProject.runes_version}-${platform}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        // Forge rejects the `+<mc>` build metadata in a Maven version range, so publish the bare mod version.
        expand version: inputs.properties.version.toString().split('\\+')[0]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Publishing configuration
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.provider { changelog_last_section() }
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"
    displayName = "${project.version}-${platform}"
    // NeoForge 1.20.1 is a fork of Forge 47.1 that kept the Forge packages and FML,
    // so the same jar loads there; both loaders are tagged.
    modLoaders.add("forge")
    modLoaders.add("neoforge")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = true
        changelogType = "markdown"
        requires("spell-engine", "more-rpg-library", "wizards")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_ID").orElse(providers.environmentVariable("MODRINTH_PROJECT_RAW_ID"))
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        requires { slug = "spell-engine" }
        requires { slug = "more-rpg-library" }
        requires { slug = "wizards" }
        optional { slug = "lne-wizards" }
    }

    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
